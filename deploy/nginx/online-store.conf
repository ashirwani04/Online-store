# Install on Linode (Ubuntu/Debian):
#   sudo cp deploy/nginx/online-store.conf /etc/nginx/sites-available/online-store
#   sudo ln -sf /etc/nginx/sites-available/online-store /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default   # if it conflicts
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace YOUR_DOMAIN with your hostname, then enable TLS:
#   sudo certbot --nginx -d YOUR_DOMAIN

upstream online_store_app {
    server 127.0.0.1:5000;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    # Allow long-running search requests (ChromaDB / embedding model).
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    send_timeout 300s;

    location /onlinestore/ {
        proxy_pass http://online_store_app/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /onlinestore;
        proxy_set_header Connection "";
    }

    # Optional: redirect bare /onlinestore to trailing slash
    location = /onlinestore {
        return 301 /onlinestore/;
    }
}
